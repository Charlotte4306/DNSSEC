server:
    interface: 0.0.0.0
    username: ""
    chroot: ""
    directory: "/tmp"
    pidfile: "/tmp/unbound.pid"
    do-ip6: no
    access-control: 127.0.0.0/8 allow
    access-control: 172.30.53.0/24 allow
    local-zone: "test." nodefault
    private-domain: "demo.test"
    qname-minimisation: no
    use-syslog: no
    log-time-ascii: yes
    verbosity: 1
    val-log-level: 2
    ede: yes
    cache-min-ttl: 0
    cache-max-ttl: 15
    val-bogus-ttl: 1
    serve-expired: no
remote-control:
    control-enable: yes
    control-interface: /tmp/unbound-control.sock
    control-use-cert: no
stub-zone:
    name: "demo.test"
    stub-addr: 172.30.53.20
    stub-first: no
