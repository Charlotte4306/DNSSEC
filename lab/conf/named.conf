options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    allow-query-cache { none; };
    dnssec-validation no;
    pid-file "/tmp/named.pid";
    session-keyfile "/tmp/session.key";
};
controls {};
zone "demo.test" {
    type primary;
    file "/signed/demo.test.signed";
    allow-transfer { none; };
};
