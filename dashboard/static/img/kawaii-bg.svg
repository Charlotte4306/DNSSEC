<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Nền kawaii: trời pastel, mây mặt cười, sao và những chiếc máy dễ thương">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1ff"/>
      <stop offset=".42" stop-color="#eef7ff"/>
      <stop offset=".74" stop-color="#f3fff8"/>
      <stop offset="1" stop-color="#fff5f8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".18" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f3e4"/>
      <stop offset="1" stop-color="#c7ecd9"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcff"/>
      <stop offset="1" stop-color="#d8c9f7"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="86" ry="40" fill="#fff" fill-opacity=".92"/>
      <ellipse cx="-48" cy="6" rx="42" ry="28" fill="#fff" fill-opacity=".92"/>
      <ellipse cx="50" cy="8" rx="38" ry="25" fill="#fff" fill-opacity=".92"/>
      <ellipse cx="-6" cy="-22" rx="40" ry="26" fill="#fff" fill-opacity=".92"/>
      <path d="M-18 -2 q6 8 12 0" stroke="#8b8b96" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M8 -2 q6 8 12 0" stroke="#8b8b96" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-26" cy="8" r="7" fill="#ffc9d6" fill-opacity=".75"/>
      <circle cx="28" cy="8" r="7" fill="#ffc9d6" fill-opacity=".75"/>
    </g>
    <path id="star" d="M0 -13 L3.6 -4 L13 -3 L6 3.4 L8 12.6 L0 7.6 L-8 12.6 L-6 3.4 L-13 -3 L-3.6 -4 Z"/>
    <path id="heart" d="M0 10 C-14 -2 -8 -14 0 -7 C8 -14 14 -2 0 10 Z"/>
    <g id="server">
      <rect x="-40" y="-56" width="80" height="112" rx="18" fill="#fff" fill-opacity=".96" stroke="#d8cdea" stroke-width="3"/>
      <rect x="-28" y="-44" width="56" height="20" rx="9" fill="#e9f6ff"/>
      <rect x="-28" y="-18" width="56" height="20" rx="9" fill="#f3ecff"/>
      <circle cx="-18" cy="-34" r="4" fill="#7fd0ff"/>
      <circle cx="-6" cy="-34" r="4" fill="#b6e6a8"/>
      <path d="M-11 14 q5.5 8 11 0" stroke="#7c7c88" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <circle cx="-20" cy="8" r="4.6" fill="#ffc9d6"/>
      <circle cx="20" cy="8" r="4.6" fill="#ffc9d6"/>
      <circle cx="-8" cy="8" r="2.6" fill="#8b8b96"/>
      <circle cx="8" cy="8" r="2.6" fill="#8b8b96"/>
      <path d="M0 -56 v-14" stroke="#c9b8e6" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="0" cy="-76" r="6" fill="#ffd9e6"/>
    </g>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <g opacity=".55">
    <use href="#star" x="120" y="120" fill="#ffe08a"/>
    <use href="#star" x="1320" y="96" fill="#ffd3e2"/>
    <use href="#star" x="1240" y="300" fill="#ffe08a" transform="scale(.7) translate(530 130)"/>
    <use href="#star" x="212" y="330" fill="#c9e8ff"/>
    <use href="#heart" x="1010" y="150" fill="#ffbdd2" opacity=".8"/>
    <use href="#heart" x="330" y="210" fill="#ffbdd2" opacity=".6"/>
  </g>

  <g class="clouds" opacity=".85">
    <use href="#cloud" x="240" y="150"/>
    <use href="#cloud" x="1150" y="210" transform="scale(.8) translate(290 55)"/>
    <use href="#cloud" x="760" y="110" transform="scale(.55) translate(620 90)"/>
  </g>

  <path d="M0 690 C210 620 380 700 560 660 C760 615 900 700 1120 655 C1280 622 1370 672 1440 650 L1440 900 L0 900 Z" fill="url(#hillA)" opacity=".8"/>
  <path d="M0 760 C180 706 340 780 520 748 C740 708 880 790 1090 748 C1270 712 1380 768 1440 742 L1440 900 L0 900 Z" fill="url(#hillB)" opacity=".85"/>

  <g opacity=".5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 20">
    <path d="M180 640 C320 560 470 640 600 590"/>
    <path d="M840 620 C960 570 1080 640 1220 580"/>
  </g>

  <use href="#server" x="300" y="742"/>
  <use href="#server" x="1130" y="770" transform="scale(.88) translate(150 110)"/>
  <use href="#server" x="720" y="800" transform="scale(.7) translate(310 250)"/>
</svg>
